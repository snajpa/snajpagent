# Workstation ~/.snajpagent/config.ini, or snajpagent remote --config PATH COMMAND...
# Only [terminal] is read by remote mode.
[terminal]
download_dir = ~/Downloads
# Explicit Vim yanks use the native desktop clipboard. osc52 sends an
# unconfirmed terminal sequence; off keeps copies in the workspace register.
clipboard = native
