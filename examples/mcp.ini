# Merge into your normal configuration; replace the service-specific metadata.
[mcp docs]
url = https://mcp.example.net/mcp
resource = https://mcp.example.net
issuer = https://login.example.net
client_id = registered-client-id
# client_secret = /absolute/private/client-secret
scope = documents:read
identity = documentation workspace
read_only_tools = ["search_documents", "read_document"]
# Calls outside these exact local lists require interactive inspection/approval.
allow_tools = []
deny_tools = []
timeout_ms = 60000
